<title>AM Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#0b0f19;color:#dfe7f0;
    font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,sans-serif;font-size:16px}
  .gate{width:100%;max-width:420px;background:#0d1321;border:1px solid #1e293b;border-radius:8px;
    padding:34px 32px 30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .bar{height:3px;width:110px;border-radius:2px;margin-bottom:26px;
    background:linear-gradient(to right,#22d3ee,#38bdf8,#818cf8)}
  img{height:34px;width:auto;display:block;margin-bottom:22px}
  h1{font-size:20px;font-weight:600;color:#fff;margin:0 0 8px;letter-spacing:-.01em}
  p.sub{margin:0 0 10px;color:#aab8c8;font-size:14.5px;line-height:1.6}
  p.sub.en{margin:0 0 24px;color:#7d8ea1;text-align:left}
  label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:#7d8ea1;margin-bottom:8px}
  input{width:100%;padding:12px 14px;border-radius:5px;border:1px solid #263449;
    background:#0b101c;color:#fff;font-size:16px;font-family:inherit;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.16)}
  button{width:100%;margin-top:14px;padding:12px 14px;border-radius:5px;border:0;cursor:pointer;
    background:#22d3ee;color:#06131a;font-weight:600;font-size:15px;font-family:inherit}
  button:hover{background:#38bdf8}
  button:disabled{opacity:.55;cursor:default}
  .err{margin-top:14px;color:#f87171;font-size:14px;min-height:20px}
  .ft{margin-top:24px;padding-top:18px;border-top:1px solid #1e293b;font-size:12.5px;color:#7d8ea1}
  .ft a{color:#38bdf8;text-decoration:none}
</style>
</head>

  var dec = new TextDecoder(), enc = new TextEncoder();
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');

  function bytes(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  async function unlock(password) {
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(

    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(CT));

  }

  function render(html) {
    // document.write after open() reparses the whole document, so the page's own
    // scripts run — innerHTML would inject them inert
    document.open();
    document.write(html);
    document.close();
  }

    go.disabled = true;
    go.textContent = 'פותח… · Unlocking…';

  try {

    if (saved) unlock(saved).then(render).catch(function () { sessionStorage.removeItem('pgKey'); });
