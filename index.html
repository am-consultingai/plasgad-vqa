<title>AM Consulting</title>

<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#f3f7fb;color:#28374a;
    font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,sans-serif;font-size:16px}
  .gate{width:100%;max-width:420px;background:#fff;border:1px solid #d6e2ef;border-radius:8px;
    padding:34px 32px 30px;box-shadow:0 18px 44px rgba(16,42,71,.10)}
  .bar{height:3px;width:110px;border-radius:2px;margin-bottom:26px;
    background:linear-gradient(to right,#22d3ee,#38bdf8,#818cf8)}
  img{height:34px;width:auto;display:block;margin-bottom:22px}
  h1{font-size:20px;font-weight:600;color:#0a1220;margin:0 0 8px;letter-spacing:-.01em}
  p.sub{margin:0 0 10px;color:#28374a;font-size:14.5px;line-height:1.6}
  p.sub.en{margin:0 0 24px;color:#55677d;text-align:left}
  label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:#55677d;margin-bottom:8px}
  input{width:100%;padding:12px 14px;border-radius:5px;border:1px solid #cbd9e8;
    background:#f7fafd;color:#0a1220;font-size:16px;font-family:inherit;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:#0e7490;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
  button{width:100%;margin-top:14px;padding:12px 14px;border-radius:5px;border:0;cursor:pointer;
    background:#0e7490;color:#fff;font-weight:600;font-size:15px;font-family:inherit}
  button:hover{background:#0369a1}
  button:disabled{opacity:.55;cursor:default}
  .err{margin-top:14px;color:#b91c1c;font-size:14px;min-height:20px}
  .ft{margin-top:24px;padding-top:18px;border-top:1px solid #d6e2ef;font-size:12.5px;color:#55677d}
  .ft a{color:#0369a1;text-decoration:none}
</style>
</head>

  var dec = new TextDecoder(), enc = new TextEncoder();
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');

  function bytes(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  async function unlock(password) {
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(

    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(CT));

  }

  function render(html) {
    // document.write after open() reparses the whole document, so the page's own
    // scripts run — innerHTML would inject them inert
    document.open();
    document.write(html);
    document.close();
  }

    err.textContent = '';
    go.disabled = true;
    go.textContent = 'פותח… · Unlocking…';
    try {
      var html = await unlock(pw.value);
      try { sessionStorage.setItem('pgKey', pw.value); } catch (_) {}

    } catch (_) {

      go.disabled = false;

      pw.select();

  try {
    var saved = sessionStorage.getItem('pgKey');
    if (saved) unlock(saved).then(render).catch(function () { sessionStorage.removeItem('pgKey'); });
  } catch (_) {}
})();
